<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloud Notes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Cloud Notes App</h1>
        <form action="/add" method="post">
            <input type="text" name="content" placeholder="Write a note..." required>
            <button type="submit">Add Note</button>
        </form>
        <ul>
        {% for note in notes %}
            <li>{{ note['content'] }} <a href="/delete/{{ note['id'] }}">Delete</a></li>
        {% endfor %}
        </ul>
    </div>
</body>
</html>
